[project]
name = "bptp"
version = "1.1.0"
description = "A Repackaging of bPTP for easier use as a module"
authors = [
    { name = "tokebe", email = "43009413+tokebe@users.noreply.github.com" },
]
requires-python = "~=3.11"
readme = "README.md"
license = "GPL-3.0"
keywords = ["ptp", "bptp"]
dependencies = [
    "pillow>=10.4.0,<11",
    "numpy>=1.26.4,<2",
    "scipy>=1.13.1,<2",
    "matplotlib>=3.10.0,<4",
    "lxml>=5.2.2,<6",
    "ete3>=3.1.3",
    "python-nexus>=2.9.0,<3",
    "PyQt5-sip==12.*",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
