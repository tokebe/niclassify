---
# prefix errors with ERR_
# prefix warning with WARN_
ERR_TSV_CONCAT:
  Failed to concatenate input files, they may be structurally incompatible.
  Run again with --debug to see exact error.
ERR_MISSING_NUCLEOTIDES_COLUMN:
  Selected data file does not contain required column
  [bold]nucleotide[/].
ERR_RESPONSE_DECODE:
  There was an error while decoding the server response. Please
  try again. If this operation fails repeatedly please check the status of BOLD servers
  and/or register an issue on the repository with the exact search terms used.
ERR_BOLD_FILE: Download from BOLD returned an erroneous file, please try again.
ERR_BOLD_NO_OBSERVATIONS: No observations were found. Please check your search terms.
ERR_NO_SPECIES_NAME: The provided data does not include column species_name. Cannot lookup species status.
ERR_MISSING_UID:
  The given file is missing the UID column generated by filter command.
  This column is required for generating FASTA files.
ERR_BOLD_SEARCH: |-
  There was an error searching BOLD (see above for error).
  Please check your connection and the status of the BOLD servers.
